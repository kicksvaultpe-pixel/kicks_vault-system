<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Registro móvil — Kicks Vault</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kicksvault/tokens.css">
<link rel="stylesheet" href="ds/kicksvault/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=Archivo+Black&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1d4ed8}a:hover{color:#1e40af}
</style>
</helmet>
<div data-theme="{{theme}}" class="kv-stage" style="position: relative; width: 390px; height: 844px; padding: 0; overflow: hidden; font-family: Archivo, system-ui, sans-serif; color: var(--text)">
  <div style="height: 844px; overflow-y: auto; overscroll-behavior: contain">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 54px 16px 0">
      <a class="kv-icon-btn kv-glass-strong" href="Movil-Inventario.dc.html" aria-label="Volver"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg></a>
      <div class="tc-widget" style="display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 6px 14px">
        <span class="kv-overline">TC</span><span style="font-size: 15px; font-weight: 700; color: var(--accent-ink)">3.70</span>
      </div>
    </div>

    <main class="view" style="display: block; padding: 12px 16px 200px">
      <div style="margin-bottom: 16px">
        <div class="page-title">Registro</div>
        <div class="page-sub">¿Qué movimiento vas a registrar?</div>
      </div>

      <div class="tipo-selector" role="tablist" aria-label="Tipo de movimiento">
        <sc-for list="{{tipos}}" as="t" hint-placeholder-count="6">
          <button class="{{t.cls}}" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}">{{t.label}}</button>
        </sc-for>
      </div>

      <div class="pago-toggle">
        <button class="{{contadoCls}}" onClick="{{setContado}}">Contado</button>
        <button class="{{creditoCls}}" onClick="{{setCredito}}">Crédito</button>
      </div>
      <div class="info-box info-orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M4 11h16"></path></svg><span>{{infoText}}</span></div>

      <div class="card">
        <div class="card-label">Producto</div>
        <div class="form-grid">
          <div class="field"><label for="m-marca">Marca</label><select id="m-marca"><option>Nike</option><option>Jordan</option></select></div>
          <div class="field"><label for="m-modelo">Modelo</label><input id="m-modelo" value="Dunk Low"></div>
          <div class="field"><label for="m-color">Colorway</label><input id="m-color" placeholder="Ej. Panda"></div>
          <div class="field"><label for="m-talla">Talla</label><select id="m-talla"><option>40</option><option>41</option></select></div>
        </div>
      </div>
      <div class="card">
        <div class="card-label">Precio</div>
        <div class="form-grid">
          <div class="field"><label for="m-monto">Monto S/</label><input id="m-monto" value="390.00" inputmode="decimal"><span class="kv-help">US$ 105.41 al TC 3.70</span></div>
          <div class="field"><label for="m-sug">Precio de venta sugerido S/</label><input id="m-sug" value="620.00" inputmode="decimal"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="kv-submit-bar kv-glass-strong" style="position: absolute; left: 16px; right: 16px; bottom: 28px; padding: 10px; border-radius: 22px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; font-size: 13px; padding: 0 6px"><span style="color: var(--text-secondary)">Margen esperado</span><span class="green" style="font-weight: 700">S/ 230.00 · 37.1%</span></div>
    <button class="{{submitCls}}" style="width: 100%">{{submitLabel}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["Claro","Oscuro"],"default":"Claro"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { theme: null, tipo: 'compra', pago: 'CREDITO' }; }
  renderVals() {
    const dark = (this.state.theme ?? this.props.tema ?? 'Claro') === 'Oscuro';
    const T = [['compra', 'Compra', 'btn btn-primary'], ['venta', 'Venta', 'btn btn-green'], ['reserva', 'Reserva', 'btn btn-purple'],
      ['pago', 'Gasto', 'btn btn-red'], ['costo', 'Costo', 'btn btn-primary'], ['inversion', 'Inversión', 'btn btn-primary']];
    const cur = T.find((t) => t[0] === this.state.tipo);
    const tipos = T.map((t) => ({ label: t[1], sel: String(t[0] === this.state.tipo),
      cls: 'tipo-btn ' + t[0] + (t[0] === this.state.tipo ? ' active' : ''), pick: () => this.setState({ tipo: t[0] }) }));
    const credito = this.state.pago === 'CREDITO';
    return {
      theme: dark ? 'dark' : 'light',
      tipos, submitCls: cur[2], submitLabel: 'Registrar ' + cur[1].toLowerCase(),
      contadoCls: 'ptoggle-btn contado' + (credito ? '' : ' active'),
      creditoCls: 'ptoggle-btn credito' + (credito ? ' active' : ''),
      setContado: () => this.setState({ pago: 'CONTADO' }), setCredito: () => this.setState({ pago: 'CREDITO' }),
      infoText: credito ? 'Crédito: entra como Pendiente sin afectar la caja. Paga luego desde Inventario.' : 'Contado: sale dinero hoy y se registra en el flujo de caja.'
    };
  }
}
</script>
</body>
</html>

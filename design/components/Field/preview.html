<!-- @dsCard group="Formularios" height=300 -->
<div class="kv-stage">
  <div class="card" style="margin:0">
    <div class="card-label">Identificación del producto <span class="kv-hint">· obligatorio</span></div>
    <div class="form-grid g4">
      <div class="field"><label for="m">Marca</label><select id="m"><option>Nike</option></select></div>
      <div class="field"><label for="mo">Modelo</label><input id="mo" placeholder="Ej. Jordan 1 Low"></div>
      <div class="field"><label for="t">Talla</label><input id="t" value="42"></div>
      <div class="field is-error"><label for="p">Monto S/</label><input id="p" value="0.00"><span class="kv-help">Ingresa un monto mayor a 0</span></div>
    </div>
  </div>
</div>
